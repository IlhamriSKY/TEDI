# Workspace root. The companion console-subsystem launcher `tedi.exe`
# lives in a separate workspace member (`tedi-cli/`) so Tauri 2's deb /
# dmg bundlers only see the GUI binary when they enumerate `[[bin]]`
# entries from THIS manifest. Trying to gate the stub via `[[bin]]
# required-features` here did NOT work - the bundlers ignored the gate
# and still expected `target/release/tedi` to exist, then failed because
# cargo had legitimately skipped the build. Splitting the package
# removes the entry from the bundler's view entirely.
#
# `default-members = ["."]` keeps `cargo build` in this directory
# scoped to the GUI package; the release workflow builds the stub
# explicitly via `cargo build --release -p tedi-cli` on Windows only.
[workspace]
members = ["tedi-cli"]
default-members = ["."]

[package]
name = "tedi"
version = "0.3.96"
description = "TEDI - Terminal Director. A lightweight terminal with split screens, tab grouping, and workspaces."
authors = ["IlhamriSKY"]
license = "Apache-2.0"
repository = "https://github.com/IlhamriSKY/TEDI"
homepage = "https://github.com/IlhamriSKY/TEDI"
readme = "../README.md"
edition = "2021"
# Tauri-action invokes `cargo build` without `--bin` and asks Cargo which
# binary to bundle. With the implicit bin (from package.name = "tedi" +
# src/main.rs) plus the explicit `[[bin]] TEDIApp` pointing to the same
# source, Cargo can refuse with "failed to find main binary". Pinning
# default-run resolves it deterministically.
default-run = "TEDIApp"
# Disable auto-discovery so the implicit `tedi` bin (from package.name +
# src/main.rs) does not collide with the explicit `[[bin]] TEDIApp` that
# also points to src/main.rs. The companion launcher lives in a separate
# workspace member, never in `src/bin/` of this package.
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tedi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Main GUI binary. `windows_subsystem = "windows"` (set in main.rs) detaches
# stdio on Windows so the binary cannot synchronously print to the parent
# shell - see the `tedi` console stub below. Renamed from the default
# package-name `tedi.exe` so PATHEXT on Windows finds the console stub first
# (the two cannot share a name on a case-insensitive filesystem).
[[bin]]
name = "TEDIApp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Global allocator. The default Windows system heap retains freed commit on
# bursty, fragmented workloads, so a heavy-output PTY burst (base64 chunks
# streamed host->webview) inflates the process commit to multiple GB and it
# never recedes. mimalloc decommits freed segments back to the OS on its purge
# timer, turning that high-watermark back into transient peaks. See the
# `#[global_allocator]` in lib.rs.
mimalloc = "0.1"
# `unstable` enables the multi-webview API (`Window::add_child`) used to embed
# a real native browser webview inside the preview tab.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Clipboard READS run in the host process instead of through
# `navigator.clipboard.readText()`, which cannot work on Linux - see
# `modules/clipboard.rs` for why. Writes still use the webview API. Default
# features are off deliberately: `image-data` exists for reading/writing IMAGES
# and drags in an image + TIFF/LZW + MIME-sniffing stack (~12 crates) that a
# text-only paste never touches. `wayland-data-control` is not a default but is
# required or a Wayland session (COSMIC, GNOME) has no clipboard at all; arboard
# still prefers X11 when that is what is running. Picked over
# tauri-plugin-clipboard-manager, which is the same arboard call behind an ACL
# plus that whole image stack for five commands we do not use.
arboard = { version = "3", default-features = false, features = [
	"wayland-data-control",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "5"
base64 = "0.22"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
# Direct `regex` for `fs_grep_replace`: file-level `replace_all` instead of
# the line-by-line `grep_regex` matcher used for read-only search.
regex = "1"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Streaming HTML rewriter (CloudFlare). Used by the preview proxy to route
# subresource URLs (img/script/link/source) through ourselves so per-asset
# CORP same-site headers can be stripped.
lol_html = "1"
url = "2"
# Default features pull in aws-lc-rs which needs NASM at build time on
# Windows. Use ring instead - pure-Rust + assembly, no toolchain hassle.
russh = { version = "0.60", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
# Extension system: zip extraction with path-traversal guards via
# `ZipFile::enclosed_name()`. Tracks the same major line that
# `tauri-plugin-updater` already pulls in (zip 4.x) so the build ships one
# copy of the crate and the untrusted-archive parser stays on the maintained
# line. Default features bring deflate/bzip2/zstd which cover released zips.
zip = { version = "4", default-features = false, features = ["deflate"] }
# SHA-256 for extension integrity hashing (used to surface a stable
# fingerprint in the install-review dialog; not used as a trust anchor).
sha2 = "0.10"
hex = "0.4"
# Arrow-key `Select` prompt for interactive `tedi ext` subcommands when
# the user omits the target argument. Default features bring `editor` /
# `history` / `password` / fuzzy which we don't use; the bare Select widget
# is in the always-on base. Picked over `ratatui` deliberately: dialoguer
# stays inline (no alternate screen, no raw-mode contention with the
# parent shell), which works reliably across every Windows console host
# we ship to without needing a separate console-subsystem companion binary.
dialoguer = { version = "0.11", default-features = false }
# Verify-only minisign implementation. Same crate `tauri-plugin-updater`
# uses internally - keeps the headless `tedi --update` path semantically
# identical to the GUI updater. No signing dependencies pulled in.
minisign-verify = "0.2"
# Stable session ids for the sidecar PTY daemon. v4 (random) is plenty - we
# only need uniqueness across the daemon's lifetime, not global ordering.
uuid = { version = "1", features = ["v4", "serde"] }
# Cross-platform local IPC for the sidecar PTY daemon. Wraps Unix domain
# sockets and Windows named pipes behind one API so the daemon protocol does
# not need parallel transport implementations.
interprocess = { version = "2.2", features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Cryptography",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_Graphics_Dwm",
	"Win32_Graphics_Gdi",
	"Win32_UI_WindowsAndMessaging",
] }
# Capture the focused tab's webview content directly (just the tab, no window
# chrome) via ICoreWebView2::CapturePreview. A plain screen grab misses WebView2
# on Windows because it composites through DirectComposition. Versions match the
# copies wry already pulls in, so no duplicate crates are added.
webview2-com = "0.38"
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Memory",
] }

# macOS/Linux: their screen capture DOES include the webview surface, so the
# on-demand browser screenshot grabs the composited screen and crops to the pane.
[target.'cfg(not(target_os = "windows"))'.dependencies]
# 0.4.0 is the last X11-only release (0.4.1+ pulls pipewire/Wayland, which needs
# a newer libpipewire than ubuntu-22.04 ships). Fixes the macOS compile bug that
# 0.0.14 had, while keeping the build light (xcb + dbus, no pipewire/clang).
xcap = "=0.4.0"
# Add only the JPEG codec to xcap's re-exported `image` crate (it defaults to
# PNG-only). Feature-unifies with xcap's own `image` dep, so `xcap::image` gains
# JPEG without image/default's heavy AVIF/webp encoders.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
