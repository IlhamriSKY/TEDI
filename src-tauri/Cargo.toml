[package]
name = "tedi"
version = "0.2.20"
description = "TEDI - Terminal Environment & Development Infrastructure. A lightweight terminal with split screens, tab grouping, and workspaces."
authors = ["IlhamriSKY"]
edition = "2021"
# `tauri-action` invokes `cargo build` without `--bin`, then asks Cargo
# which binary to bundle. With two `[[bin]]` entries below Cargo would
# otherwise refuse with "failed to find main binary, make sure you have
# a package > default-run in the Cargo.toml file" — pin TEDIApp (the GUI
# binary) as the main one so the Tauri bundler picks it.
default-run = "TEDIApp"
# Disable Cargo's auto-discovery of `src/bin/*.rs`. We declare every binary
# explicitly below so each one carries the right `required-features` /
# subsystem gate. Auto-discovery would otherwise add a duplicate `tedi`
# bin (from `src/bin/tedi.rs`) WITHOUT the feature gate, which Tauri 2's
# deb / dmg bundlers then try to bundle as a sidecar — failing with
# "/target/release/tedi-cli does not exist" (when the path stem still
# matched the legacy filename) or worse, dropping an unsigned secondary
# binary into the macOS .app bundle.
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Opt-in gate for the `tedi` console-subsystem launcher. Off by default so
# `cargo build` on macOS / Linux skips the stub (it serves no purpose there
# and Tauri's macOS bundler would otherwise drop the secondary binary inside
# `TEDI.app/Contents/MacOS/`, which trips ad-hoc codesign on x86_64 with
# "code object is not signed at all. In subcomponent: ... /tedi"). The
# Windows release step in `.github/workflows/release.yml` enables it via
# `cargo build --release --bin tedi --features tedi-cli`; the subsequent
# `tauri-action` `cargo build` (no features) leaves the previously-built
# artifact intact via cargo's incremental cache.
tedi-cli = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tedi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Main GUI binary. `windows_subsystem = "windows"` (set in main.rs) detaches
# stdio on Windows so the binary cannot synchronously print to the parent
# shell — see the `tedi` console stub below. Renamed from the default
# package-name `tedi.exe` so PATHEXT on Windows finds the console stub first
# (the two cannot share a name on a case-insensitive filesystem).
[[bin]]
name = "TEDIApp"
path = "src/main.rs"

# Console-subsystem entry point shipped as `tedi.exe` next to `TEDIApp.exe`
# on Windows. PowerShell does not synchronously wait for GUI-subsystem
# children, so output from the GUI binary lands AFTER the shell has already
# redrawn its prompt — the cursor ends up mid-line and the user has to press
# Enter to recover. The console stub solves this: PowerShell waits for it
# like any normal CLI, it parses argv, handles `--help` / `--version`
# natively, and forwards `--update` / `ext` / `--extension` to `TEDIApp.exe`
# synchronously with `Stdio::inherit`. GUI launches are detached so the
# shell prompt returns immediately.
#
# Built on Windows only (gated behind the `tedi-cli` feature — see
# `[features]` above). On macOS / Linux this binary would land in
# `TEDI.app/Contents/MacOS/tedi` and break ad-hoc codesign on x86_64. The
# subsystem-split problem only exists on Windows anyway, so the stub
# serves no purpose on POSIX where the GUI binary inherits stdio natively.
[[bin]]
name = "tedi"
path = "src/bin/tedi.rs"
required-features = ["tedi-cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "5"
base64 = "0.22"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Streaming HTML rewriter (CloudFlare). Used by the preview proxy to route
# subresource URLs (img/script/link/source) through ourselves so per-asset
# CORP same-site headers can be stripped.
lol_html = "1"
url = "2"
# Default features pull in aws-lc-rs which needs NASM at build time on
# Windows. Use ring instead - pure-Rust + assembly, no toolchain hassle.
russh = { version = "0.60", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
async-trait = "0.1"
# Extension system: zip extraction with path-traversal guards via
# `ZipFile::enclosed_name()`. Pinned to a recent line; default features
# bring deflate/bzip2/zstd which cover GitHub-released zips.
zip = { version = "2", default-features = false, features = ["deflate"] }
# SHA-256 for extension integrity hashing (used to surface a stable
# fingerprint in the install-review dialog; not used as a trust anchor).
sha2 = "0.10"
hex = "0.4"
# Arrow-key `Select` prompt for interactive `tedi ext` subcommands when
# the user omits the target argument. Default features bring `editor` /
# `history` / `password` / fuzzy which we don't use; the bare Select widget
# is in the always-on base. Picked over `ratatui` deliberately: dialoguer
# stays inline (no alternate screen, no raw-mode contention with the
# parent shell), which works reliably across every Windows console host
# we ship to without needing a separate console-subsystem companion binary.
dialoguer = { version = "0.11", default-features = false }
# Verify-only minisign implementation. Same crate `tauri-plugin-updater`
# uses internally — keeps the headless `tedi --update` path semantically
# identical to the GUI updater. No signing dependencies pulled in.
minisign-verify = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Cryptography",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_Graphics_Dwm",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
