name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # Pinned to v4: pnpm/action-setup@v6's self-installer crashes on
      # windows-2025 runners with STATUS_STACK_BUFFER_OVERRUN (0xC0000409).
      # v4 uses a different install mechanism that works on all platforms.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Build the `tedi-cli` console-subsystem companion binary on Windows
      # so the NSIS bundler (driven by `tauri-action` below) can resource it
      # via `tauri.windows.conf.json: bundle.resources`. `tauri-action`
      # otherwise only builds the main `tedi` bin. Cargo's incremental
      # cache means the subsequent main build is a no-op for tedi-cli.
      - name: Build tedi-cli console binary (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        run: cargo build --release --bin tedi-cli

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TEDI ${{ github.ref_name }}"
          releaseBody: |
            Installed TEDI checks GitHub Releases every 6 hours and offers in-app updates.
            First-time install: download the artifact for your platform from the assets below.

            **macOS users:** TEDI is not notarized with Apple. If you see "TEDI is damaged and can't be opened", drag the app to `/Applications` and run this once in Terminal:

            ```
            xattr -cr /Applications/TEDI.app
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
