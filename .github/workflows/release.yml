name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # Pinned to v4: pnpm/action-setup@v6's self-installer crashes on
      # windows-2025 runners with STATUS_STACK_BUFFER_OVERRUN (0xC0000409).
      # v4 uses a different install mechanism that works on all platforms.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Build the `tedi` console-subsystem launcher (Windows only). The
      # NSIS hook in `installer.nsh` `File`s the resulting binary from
      # `src-tauri/target/release/tedi.exe` into the install dir alongside
      # the GUI `TEDIApp.exe`. `tauri-action` below only builds the main
      # binary (the one named by `default-run`), so the stub needs an
      # explicit step. Cargo's incremental cache means the subsequent main
      # build reuses everything compiled here.
      - name: Build tedi console launcher (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        # `--features tedi-cli` is required: the `[[bin]] tedi` target in
        # Cargo.toml is gated by `required-features = ["tedi-cli"]` so that
        # the subsequent `tauri-action` `cargo build` (no features) on
        # macOS / Linux skips the stub. Otherwise Tauri's macOS bundler
        # drops `tedi` into `TEDI.app/Contents/MacOS/` and ad-hoc codesign
        # blows up on x86_64 with "code object is not signed at all.
        # In subcomponent: ... /tedi".
        run: cargo build --release --bin tedi --features tedi-cli

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TEDI ${{ github.ref_name }}"
          releaseBody: |
            Installed TEDI checks GitHub Releases every 6 hours and offers in-app updates.
            First-time install: download the artifact for your platform from the assets below.

            **macOS users:** TEDI is not notarized with Apple. If you see "TEDI is damaged and can't be opened", drag the app to `/Applications` and run this once in Terminal:

            ```
            xattr -cr /Applications/TEDI.app
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
