name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to v4 to match release.yml (which needed the downgrade to
      # avoid pnpm/action-setup@v6's self-installer crash on windows-2025).
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Check module import discipline
        run: pnpm run lint:imports

      - name: Build frontend
        run: pnpm build

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # libdbus-1-dev / libxcb1-dev / libxcb-randr0-dev are for `xcap` (the
        # browser-screenshot capture on Linux), which links dbus + xcb (randr).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxcb-randr0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # Runs the 27 backend unit tests, including pubkey_constant_decodes which
      # guards the embedded updater pubkey. The network-hitting live updater test
      # is #[ignore]d, so the default run stays offline and fast.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
